name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Frontmatter, dangling links, unresolved related topics, and design-token
      # violations such as hardcoded colours in components.
      - name: Validate content and design tokens
        run: npm run validate

      # Guards the MDX pipeline invariants, which can break silently.
      - name: Check MDX pipeline
        run: npm run check:pipeline

      - name: Build
        run: npm run build
